name: ⚙️ Setup VPS EN Inicial

on:
  workflow_dispatch:

jobs:
  setup:
    name: One-time VPS setup for Canal EN
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_EN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 80.241.213.27 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create directories on VPS
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 \
            "mkdir -p /root/ao_vivo_en/{blocos,suplicas,insumos_h,musicas/manha,musicas/noite,videos_base} && echo Directories OK"

      - name: Install Python dependencies on VPS
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 \
            "pip3 install google-genai google-api-python-client google-auth pytz edge-tts python-dotenv pillow numpy 2>/dev/null || true && echo Dependencies OK"

      - name: Copy scripts to VPS
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_en/ao_vivo_en.py \
            root@80.241.213.27:/root/ao_vivo_en/ao_vivo_en.py
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_en/ao_vivo_en.service \
            root@80.241.213.27:/root/ao_vivo_en/ao_vivo_en.service

      - name: Install systemd service (enabled but NOT started — awaits OAuth + stream key)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@80.241.213.27 "
            cp /root/ao_vivo_en/ao_vivo_en.service /etc/systemd/system/ao_vivo_en.service
            systemctl daemon-reload
            systemctl enable ao_vivo_en
            echo 'Service EN installed and enabled (NOT started — awaits OAuth token + stream key + .env)'
          "

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
