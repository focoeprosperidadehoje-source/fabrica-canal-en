name: 🔐 Deploy google_credentials_en → VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Write google_credentials_en.json to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH for VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_EN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write google_credentials_en.json on VPS
        env:
          GOOGLE_CREDENTIALS_EN: ${{ secrets.GOOGLE_CREDENTIALS_EN }}
        run: |
          echo "$GOOGLE_CREDENTIALS_EN" | ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "cat > /root/ao_vivo_en/google_credentials_en.json && chmod 600 /root/ao_vivo_en/google_credentials_en.json && echo '✅ google_credentials_en.json written'"

      - name: Verify file exists
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "ls -lh /root/ao_vivo_en/google_credentials_en.json && python3 -c \"import json; d=json.load(open('/root/ao_vivo_en/google_credentials_en.json')); print('type:', d.get('type','?'), '| project:', d.get('project_id','?'))\""

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
