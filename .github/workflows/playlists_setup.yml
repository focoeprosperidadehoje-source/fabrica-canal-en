name: 5. Playlists das Novenas (EN)

on:
  schedule:
    - cron: '37 9 * * 1' # segunda
  push:
    paths:
      - '.github/workflows/playlists_setup.yml'
      - 'playlists_setup.py'
  workflow_dispatch:

jobs:
  playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 gspread google-genai pytz
      - env:
          CANAL: "EN"
          GOOGLE_CREDENTIALS_EN: ${{ secrets.GOOGLE_CREDENTIALS_EN }}
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
        run: python playlists_setup.py
