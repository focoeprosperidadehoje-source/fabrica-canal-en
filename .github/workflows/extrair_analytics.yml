name: Extrair Analytics EN
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Create script
        run: |
          cat > /tmp/analytics.py << 'PYEOF'
          import os, json
          from datetime import datetime, timedelta
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          canal = os.environ.get('CANAL', '?')
          token_str = os.environ.get('YT_TOKEN', '').lstrip('﻿')
          hoje_str = datetime.now().strftime('%Y-%m-%d')
          linhas = [f"# Analytics {canal} — {hoje_str}", ""]
          try:
              creds = Credentials.from_authorized_user_info(json.loads(token_str))
              if creds.expired and creds.refresh_token:
                  creds.refresh(Request())
              ya = build('youtubeAnalytics', 'v2', credentials=creds)
              hoje = datetime.now().strftime('%Y-%m-%d')
              r_total = ya.reports().query(
                  ids='channel==MINE', startDate='2024-01-01', endDate=hoje,
                  metrics='estimatedMinutesWatched,views,averageViewDuration'
              ).execute()
              d28 = (datetime.now() - timedelta(days=28)).strftime('%Y-%m-%d')
              r_28d = ya.reports().query(
                  ids='channel==MINE', startDate=d28, endDate=hoje,
                  metrics='estimatedMinutesWatched,views,averageViewDuration'
              ).execute()
              d7 = (datetime.now() - timedelta(days=7)).strftime('%Y-%m-%d')
              r_7d = ya.reports().query(
                  ids='channel==MINE', startDate=d7, endDate=hoje,
                  metrics='estimatedMinutesWatched,views,averageViewDuration'
              ).execute()
              def row(r): return (r.get('rows') or [[0, 0, 0]])[0]
              tot = row(r_total)
              d28r = row(r_28d)
              d7r = row(r_7d)
              media_dia = d28r[0] / 60 / 28 if d28r[0] else 0
              wt_atual = tot[0] / 60
              alvo = 4000
              restante = max(0, alvo - wt_atual)
              pct = wt_atual / alvo * 100
              linhas += [
                  f"## Watch Time",
                  f"- Acumulado (desde 2024): **{wt_atual:,.1f}h** ({int(tot[0]):,} min)",
                  f"- Últimos 28 dias: **{d28r[0]/60:,.1f}h**",
                  f"- Últimos 7 dias: **{d7r[0]/60:,.1f}h**",
                  f"- Média diária (28d): **{media_dia:.1f}h/dia**",
                  "",
                  f"## Views",
                  f"- Total: **{int(tot[1]):,}**",
                  f"- Últimos 28 dias: **{int(d28r[1]):,}**",
                  f"- Últimos 7 dias: **{int(d7r[1]):,}**",
                  "",
                  f"## Duração Média",
                  f"- {int(tot[2])}s = {int(tot[2])//60}min{int(tot[2])%60}s",
                  "",
                  f"## Meta YPP 4.000h",
                  f"- Progresso: **{wt_atual:.0f}h / {alvo}h ({pct:.1f}%)**",
                  f"- Faltam: **{restante:.0f}h**",
              ]
              if media_dia > 0:
                  dias_restantes = restante / media_dia
                  eta = (datetime.now() + timedelta(days=dias_restantes)).strftime('%Y-%m-%d')
                  linhas.append(f"- ETA estimada: **{eta}** (a {dias_restantes:.0f} dias)")
          except Exception as e:
              linhas += [f"## ERRO", f"```", f"{e}", f"```"]
              if '403' in str(e) or 'forbidden' in str(e).lower():
                  linhas.append("Causa: token sem escopo yt-analytics.readonly")
              elif '401' in str(e):
                  linhas.append("Causa: token expirado ou invalido")
          print('\n'.join(linhas))
          PYEOF

      - name: Run analytics and save report
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          CANAL: EN
        run: |
          mkdir -p relatorios
          python3 /tmp/analytics.py | tee relatorios/analytics_EN_$(date +%Y-%m-%d).md
          cp relatorios/analytics_EN_$(date +%Y-%m-%d).md relatorios/analytics_EN_ultimo.md

      - name: Commit and push report
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add relatorios/
          git diff --staged --quiet || git commit -m "analytics: report EN $(date +%Y-%m-%d)"
          git push
