name: Limpar blocos ruins VPS2 (EN+PL)
on:
  workflow_dispatch:
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_EN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Limpar EN e PL
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 bash << 'ENDSSH'
          echo "=== ANTES DA LIMPEZA ==="
          echo "EN blocos H: $(ls /root/ao_vivo_en/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          echo "PL blocos H: $(ls /root/ao_vivo_pl/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"

          echo ""
          echo "=== REMOVENDO bloco EN ruim (29MB, sem imagens, pre-OurLady) ==="
          rm -fv /root/ao_vivo_en/blocos/bloco_20260822_1620_03_h.mp4

          echo ""
          echo "=== REMOVENDO blocos PL ruins (tela preta e parcial, pre-Czestochowa) ==="
          rm -fv /root/ao_vivo_pl/blocos/bloco_20260822_2220_03_h.mp4
          rm -fv /root/ao_vivo_pl/blocos/bloco_20260822_2220_04_h.mp4

          echo ""
          echo "=== APOS LIMPEZA ==="
          echo "EN blocos H: $(ls /root/ao_vivo_en/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          ls -lh /root/ao_vivo_en/blocos/bloco_*_h.mp4 2>/dev/null
          echo ""
          echo "PL blocos H: $(ls /root/ao_vivo_pl/blocos/bloco_*_h.mp4 2>/dev/null | wc -l)"
          ls -lh /root/ao_vivo_pl/blocos/bloco_*_h.mp4 2>/dev/null
          echo ""
          echo "EN audio pendente: $(ls /root/ao_vivo_en/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          echo "PL audio pendente: $(ls /root/ao_vivo_pl/blocos/audio_*.mp3 2>/dev/null | wc -l)"
          ENDSSH

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/vps_key
