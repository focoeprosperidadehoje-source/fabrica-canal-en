name: 🚀 Deploy ao vivo EN

on:
  push:
    paths:
      - 'ao_vivo_en/ao_vivo_en.py'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Mode: deploy | status'
        default: 'deploy'
        required: true

jobs:
  deploy:
    name: Deploy ao_vivo_en.py to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_EN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy script to VPS
        if: ${{ github.event.inputs.modo != 'status' }}
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_en/ao_vivo_en.py \
            root@169.58.220.233:/root/ao_vivo_en/ao_vivo_en.py

      - name: Restart or check service
        run: |
          MODO="${{ github.event.inputs.modo }}"
          if [ "$MODO" = "status" ]; then
            ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
              "systemctl is-active ao_vivo_en; journalctl -u ao_vivo_en -n 30 --no-pager"
          else
            ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
              "systemctl restart ao_vivo_en && sleep 5 && systemctl is-active ao_vivo_en && echo DEPLOY_OK"
          fi

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
