name: 🚀 Deploy ao vivo EN

on:
  push:
    paths:
      - 'ao_vivo_en/ao_vivo_en.py'
      - 'ao_vivo_en/ao_vivo_en.service'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Mode: deploy | status | rebuild_deps'
        default: 'deploy'
        required: true

jobs:
  deploy:
    name: Deploy ao_vivo_en.py to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_EN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Status do serviço (modo status)
        if: github.event.inputs.modo == 'status'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 "
            systemctl is-active ao_vivo_en
            journalctl -u ao_vivo_en -n 20 --no-pager
            echo '--- FFMPEG SPEED ---'
            tail -c 2000 /root/ao_vivo_en/ffmpeg_h.log 2>/dev/null | tr '\r' '\n' | grep -E 'speed=|fps=' | tail -5 || echo 'sem dados'
            echo '--- BLOCOS ---'
            ls /root/ao_vivo_en/blocos/*.mp4 2>/dev/null | wc -l || echo '0 blocos'
          "

      - name: Rebuild venv_en (modo rebuild_deps apenas)
        if: github.event.inputs.modo == 'rebuild_deps'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 bash << 'ENDSSH'
            set -e
            export DEBIAN_FRONTEND=noninteractive
            if ! dpkg -l python3.12-venv 2>/dev/null | grep -q "^ii"; then
              for i in 1 2 3 4 5; do
                apt-get update -qq && apt-get install -y python3.12-venv python3-pip -qq 2>/dev/null && break
                sleep 15
              done
            fi
            systemctl stop ao_vivo_en || true
            sleep 5
            kill -9 $(pgrep -f ao_vivo_en) 2>/dev/null || true
            sleep 2
            find /root/venv_en -type f -delete 2>/dev/null || true
            find /root/venv_en -type d -empty -delete 2>/dev/null || true
            rm -rf /root/venv_en 2>/dev/null || true
            python3 -m venv /root/venv_en
            /root/venv_en/bin/pip install --upgrade pip --quiet
            /root/venv_en/bin/pip install --quiet \
              google-genai google-api-python-client google-auth google-auth-oauthlib \
              pytz edge-tts pillow numpy
            /root/venv_en/bin/python3 -c "from google import genai; print('✅ google-genai OK')"
            echo "✅ venv_en recriado com dependências"
          ENDSSH

      - name: Deploy ao_vivo_en.py e service file
        if: github.event.inputs.modo == 'deploy' || github.event.inputs.modo == 'rebuild_deps'
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_en/ao_vivo_en.py \
            root@169.58.220.233:/root/ao_vivo_en/ao_vivo_en.py
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_en/ao_vivo_en.service \
            root@169.58.220.233:/etc/systemd/system/ao_vivo_en.service

      - name: Reiniciar serviço
        if: github.event.inputs.modo == 'deploy' || github.event.inputs.modo == 'rebuild_deps'
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 "
            systemctl daemon-reload
            systemctl restart ao_vivo_en
            sleep 20
            STATUS=\$(systemctl is-active ao_vivo_en)
            echo \"Service status: \$STATUS\"
            journalctl -u ao_vivo_en -n 25 --no-pager
            if [ \"\$STATUS\" = 'active' ] || [ \"\$STATUS\" = 'activating' ]; then
              echo DEPLOY_OK
            else
              echo DEPLOY_FAILED
              exit 1
            fi
          "

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
