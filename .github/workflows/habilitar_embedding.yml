name: Habilitar Embedding EN

on:
  workflow_dispatch:

jobs:
  habilitar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Habilitar embedding
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_EN }}
        run: python habilitar_embedding.py
