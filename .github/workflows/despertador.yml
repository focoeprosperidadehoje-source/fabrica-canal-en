name: 1. Usina Longos (EN)

on:
  schedule:
    - cron: '30 1 * * *' # 21:30 ET (prev day)
    - cron: '30 2 * * *' # 22:30 ET (prev day)
    - cron: '30 3 * * *' # 23:30 ET (prev day)
  push:
    paths:
      - '.github/workflows/despertador.yml'  # roda na hora sempre que este arquivo muda
  workflow_dispatch:

jobs:
  produzir_videos:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - run: pip install --upgrade google-genai gspread
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GOOGLE_CREDENTIALS_EN: ${{ secrets.GOOGLE_CREDENTIALS_EN }}
        run: for i in 1 2 3 4 5 6; do python usina.py || echo "execucao $i falhou"; done

